<script>

(()=>{
const PX=1;
const cv=document.getElementById('c');
let R;try{R=new THREE.WebGLRenderer({canvas:cv,antialias:false})}catch(e){document.getElementById('fallback').style.display='flex';return}R.setPixelRatio(1);
const S=new THREE.Scene();

addEventListener('resize',size);size();

// dusk sky dome: dusty rose horizon to deep violet overhead
const dome=new THREE.Mesh(new THREE.SphereGeometry(600,16,12),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying float h;void main(){vec3 a=vec3(.62,.45,.47),b=vec3(.38,.31,.45),c=vec3(.13,.12,.25);vec3 col=mix(a,b,smoothstep(0.,.18,h));col=mix(col,c,smoothstep(.18,.75,h));gl_FragColor=vec4(col,1.);}'}));
S.add(dome);
// stars
const sv=[];for(let i=0;i<500;i++){const th=Math.random()*6.283,ph=Math.random()*1.3+.1;sv.push(Math.cos(th)*Math.cos(ph)*550,Math.sin(ph)*550,Math.sin(th)*Math.cos(ph)*550)}
const sg0=new THREE.BufferGeometry();sg0.setAttribute('position',new THREE.Float32BufferAttribute(sv,3));
const stars=new THREE.Points(sg0,new THREE.PointsMaterial({color:'#fff',size:1.2,sizeAttenuation:false,fog:false,transparent:true,opacity:.35}));S.add(stars);
// full moon + halo
const moon=new THREE.Group();
moon.add(new THREE.Mesh(new THREE.CircleGeometry(22,32),new THREE.MeshBasicMaterial({color:'#f3efd9',fog:false})));
const halo=new THREE.Mesh(new THREE.CircleGeometry(60,32),new THREE.ShaderMaterial({transparent:true,depthWrite:false,fog:false,
 vertexShader:'varying vec2 u;void main(){u=position.xy/60.;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec2 u;void main(){float d=length(u);gl_FragColor=vec4(.85,.88,1.,.35*pow(1.-d,2.));}'}));
halo.position.z=-1;moon.add(halo);
[[-6,5,4],[7,-4,3],[-3,-8,3.2]].forEach(([x,y,r])=>{const m=new THREE.Mesh(new THREE.CircleGeometry(r,12),new THREE.MeshBasicMaterial({color:'#d8d2b8',fog:false}));m.position.set(x,y,.1);moon.add(m)});
moon.scale.setScalar(2);S.add(moon);

S.add(new THREE.HemisphereLight('#b8a2c2','#2c2622',.7));
const ml=new THREE.DirectionalLight('#ffcfb0',.62);S.add(ml);S.add(ml.target);

// terrain with a featured hill
const HILL={x:0,z:0};
function hgt(x,z){const h0=hgt0(x,z),fx=x+205,fz=z+58,fd=Math.exp(-(fx*fx+fz*fz)/2200);return h0*(1-fd)+hgt0(-205,-58)*fd}
function hgt0(x,z){const dx=x-HILL.x,dz=z-HILL.z;
 return Math.sin(x*.03)*4+Math.cos(z*.025)*5+Math.sin((x+z)*.07)*1.3+14*Math.exp(-Math.abs(dz)/30-dz*dz/900)*Math.exp(-dx*dx/30000)}
const g=new THREE.PlaneGeometry(1900,1900,200,200);g.rotateX(-Math.PI/2); // reaches past the mountain ring so no sky shows under it
const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,hgt(p.getX(i),p.getZ(i)));
g.computeVertexNormals();const gn=g.toNonIndexed(),gp=gn.attributes.position,cols=[];
for(let i=0;i<gp.count;i+=3){const y=(gp.getY(i)+gp.getY(i+1)+gp.getY(i+2))/3,t=Math.min(1,Math.max(0,(y+6)/22)),r=Math.random()*.05;
 const cx=(gp.getX(i)+gp.getX(i+1)+gp.getX(i+2))/3,cz=(gp.getZ(i)+gp.getZ(i+1)+gp.getZ(i+2))/3;
 const dn=Math.sin(cx*.045+1.3)*Math.cos(cz*.06)+Math.sin(cx*.12+cz*.09)*.45+Math.sin(cx*.31-cz*.27)*.2;
 const d=Math.min(1,Math.max(0,(dn-.75)*3));
 const bl=Math.sin(cx*.09+.7)*Math.cos(cz*.11+1.9)+Math.sin(cx*.21-cz*.17)*.6+Math.sin(cx*.5+cz*.43)*.3,bk=1+bl*.09,yl=Math.max(0,bl)*.04;
 const hz=Math.min(1,Math.max(0,(Math.hypot(cx-110,cz+20)-200)/420))*.5; // far ground fades toward a dusky tone, never toward pale fog
 for(let k=0;k<3;k++)cols.push((((.3+t*.09+r)*(1-d)+(.42+r)*d)*bk+yl)*(1-hz)+.33*hz,(((.34+t*.09+r)*(1-d)+(.33+r)*d)*bk+yl*.6)*(1-hz)+.26*hz,(((.21+t*.04+r*.6)*(1-d)+(.22+r*.5)*d)*bk)*(1-hz)+.29*hz)}
gn.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
const tc=document.createElement('canvas');tc.width=tc.height=64;const tx=tc.getContext('2d');
const wrapDraw=(fn)=>{for(const ox of[-64,0,64])for(const oy of[-64,0,64]){tx.save();tx.translate(ox,oy);fn();tx.restore()}};
tx.fillStyle='#b9bba8';tx.fillRect(0,0,64,64);
for(let i=0;i<34;i++){const x=Math.random()*64,y=Math.random()*64,r=4+Math.random()*12,v=Math.random(),rot=Math.random()*3,sq=.55+Math.random()*.5,
  c=v<.55?`rgba(${132+v*50|0},${142+v*40|0},${104+v*24|0},.45)`:`rgba(${206+v*25|0},${210+v*20|0},${184+v*16|0},.35)`;
 wrapDraw(()=>{const g=tx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');tx.fillStyle=g;tx.beginPath();tx.ellipse(x,y,r,r*sq,rot,0,7);tx.fill()})}
const gt=new THREE.CanvasTexture(tc);gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(110,110);
gt.magFilter=THREE.LinearFilter;gt.minFilter=THREE.LinearMipmapLinearFilter;gt.anisotropy=R.capabilities.getMaxAnisotropy();
const GROUND=new THREE.Mesh(gn,new THREE.MeshLambertMaterial({vertexColors:true,map:gt,fog:false}));S.add(GROUND);

// trees + rocks (kept off the hill crest and run lanes)
const M=c=>new THREE.MeshLambertMaterial({color:c,flatShading:true,fog:false});
const trunkM=M('#4a3626'),birchM=M('#d9d4c8'),pineM=M('#2b3a2a'),firM=M('#22301f'),leafM=[M('#3d5230'),M('#4f5f2c'),M('#5e5a2e'),M('#6b4a2a')],deadM=M('#3a302a');
const rg=new THREE.DodecahedronGeometry(1.2,0),rm=M('#6a6670');
function mk(geo,mat,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);return m}
const TREES={
 pine(){const g=new THREE.Group();g.add(mk(new THREE.CylinderGeometry(.25,.35,1.6,5),trunkM,0,.8,0));g.add(mk(new THREE.ConeGeometry(1.6,4.5,5),pineM,0,3.6,0));return g},
 fir(){const g=new THREE.Group();g.add(mk(new THREE.CylinderGeometry(.2,.3,2,5),trunkM,0,1,0));
  for(let i=0;i<3;i++)g.add(mk(new THREE.ConeGeometry(1.9-i*.5,2.6,6),firM,0,2.4+i*1.5,0));return g},
 oak(){const g=new THREE.Group(),lm=leafM[Math.random()*leafM.length|0];g.add(mk(new THREE.CylinderGeometry(.35,.5,2.6,5),trunkM,0,1.3,0));

 maple(){const g=new THREE.Group(),lm=leafM[2+(Math.random()*2|0)];g.add(mk(new THREE.CylinderGeometry(.28,.42,3.2,5),trunkM,0,1.6,0));
  [[0,4.4,0,1.8],[1.1,3.7,.6,1.3],[-1,3.9,-.5,1.35],[.3,5.2,-.4,1.1],[-.5,3.4,1,1.1]].forEach(([x,y,z,r])=>g.add(mk(new THREE.IcosahedronGeometry(r,0),lm,x,y,z)));return g},
 dead(){const g=new THREE.Group();g.add(mk(new THREE.CylinderGeometry(.15,.35,4,5),deadM,0,2,0));
  [[.9,3,.6],[-.8,2.4,-.9],[.6,3.6,-1.1]].forEach(([r,h,t])=>{const b=mk(new THREE.CylinderGeometry(.06,.12,1.8,4),deadM,0,h,0);b.rotation.z=r;b.rotation.y=t;g.add(b)});return g}};
const kinds=['pine','fir','oak','oak','oak','maple','maple','dead'];
